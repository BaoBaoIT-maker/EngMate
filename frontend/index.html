<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EngMate - Nền tảng học tiếng Anh thích ứng với AI, Flashcard SM-2 và Mini-games thú vị." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>EngMate - Học tiếng Anh thông minh</title>

    <style>
      /* ── Splash Screen Native (hiển thị trước khi React boot) ── */
      #app-splash {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: #0D0D10;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        font-family: 'Inter', sans-serif;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #app-splash.light {
        background: #ffffff;
      }
      #app-splash.light #splash-title { color: #1F2937; }
      #app-splash.light #splash-subtitle { color: #6B7280; }
      #splash-logo-wrap {
        position: relative;
        width: 88px;
        height: 88px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #splash-logo-ring {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 26px;
        background: linear-gradient(135deg, #EAB308, #B45309);
        animation: splash-pulse 1.6s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        opacity: 0.6;
      }
      #splash-logo {
        position: relative;
        width: 88px;
        height: 88px;
        border-radius: 26px;
        background: linear-gradient(135deg, #EAB308, #B45309);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.8rem;
        color: #fff;
        z-index: 1;
        box-shadow: 0 12px 36px rgba(234, 179, 8, 0.35);
        animation: splash-float 3s ease-in-out infinite;
      }
      #splash-text { text-align: center; }
      #splash-title {
        font-size: 2.2rem;
        font-weight: 800;
        color: #F9FAFB;
        letter-spacing: -0.03em;
        margin: 0 0 6px 0;
      }
      #splash-title span { color: #EAB308; }
      #splash-subtitle {
        font-size: 0.95rem;
        color: #9CA3AF;
        font-weight: 500;
        animation: splash-blink 1.4s ease-in-out infinite;
        margin: 0;
      }
      #app-splash.hide {
        opacity: 0;
        visibility: hidden;
      }
      @keyframes splash-pulse {
        0% { transform: scale(1); opacity: 0.7; }
        60%, 100% { transform: scale(1.5); opacity: 0; }
      }
      @keyframes splash-float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes splash-blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
    </style>
  </head>
  <body>
    <!-- Splash Screen: hiển thị NGAY khi trình duyệt tải trang, trước khi React boot -->
    <div id="app-splash">
      <div id="splash-logo-wrap">
        <div id="splash-logo-ring"></div>
        <div id="splash-logo">✦</div>
      </div>
      <div id="splash-text">
        <p id="splash-title">Eng<span>Mate</span></p>
        <p id="splash-subtitle">Đang tải dữ liệu...</p>
      </div>
    </div>

    <!-- Đọc localStorage theme NGAY sau khi splash div tồn tại — tránh nháy màu -->
    <script>
      try {
        var _t = JSON.parse(localStorage.getItem('theme-storage') || '{}');
        if (!_t.state?.isDark) {
          document.getElementById('app-splash').classList.add('light');
        }
      } catch(e) {}
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
